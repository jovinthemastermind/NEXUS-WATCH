<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Voice Tester</title>
<style>
  body { background:#07111f; color:#eaf4ff; font-family:system-ui; padding:20px; }
  button { background:#63d4ff; border:0; padding:10px 14px; border-radius:8px;
           font-weight:700; margin:4px 0; cursor:pointer; width:100%;
           text-align:left; color:#04111d; }
  .row { margin:10px 0; padding:10px; background:rgba(99,212,255,0.08);
         border-radius:10px; }
  .best { border:2px solid #71f0b5; }
  small { color:#9fb5cc; }
</style>
</head>
<body>
  <h2>🎙️ Voice Tester</h2>
  <p>Highest-scoring voice is highlighted. Tap any to preview.</p>
  <div id="list"></div>
  <script src="nexus-voice-human.js"></script>
  <script>
    const V = window.NexusVoiceHuman;
    function render() {
      const voices = V.listVoices();
      const el = document.getElementById('list');
      el.innerHTML = '';
      voices.forEach((v, i) => {
        const row = document.createElement('div');
        row.className = 'row' + (i === 0 ? ' best' : '');
        const btn = document.createElement('button');
        btn.textContent = `${v.qualityScore} · ${v.name}`;
        btn.onclick = () => V.preview(v.name);
        row.appendChild(btn);
        const meta = document.createElement('small');
        meta.textContent = `${v.lang} · ${v.local ? 'local' : 'network'}`;
        row.appendChild(meta);
        el.appendChild(row);
      });
      if (!voices.length) {
        el.textContent = 'No voices yet — wait a second and refresh.';
        setTimeout(render, 800);
      }
    }
    render();
    setTimeout(render, 800);
  </script>
</body>
</html>
